name: tianli-crmeb-demo

services:
  mysql:
    container_name: crmeb_demo_mysql
    image: ccr.ccs.tencentyun.com/crmebky_php/mysql:v8.0.45
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=100"]
    mem_limit: 640m
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crmeb}
      MYSQL_USER: ${MYSQL_USER:-crmeb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/mysql/.crmeb-init-complete && mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [app_net]

  redis:
    container_name: crmeb_demo_redis
    image: ccr.ccs.tencentyun.com/crmebky_php/redis:v8.6.1
    restart: unless-stopped
    mem_limit: 128m
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --pidfile
      - /data/redis.pid
      - --loglevel
      - notice
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [app_net]

  phpfpm:
    container_name: crmeb_demo_php
    image: ${PHP_IMAGE:?set PHP_IMAGE}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: Asia/Shanghai
      APP_DEBUG: "false"
      DEFAULT_TIMEZONE: Asia/Shanghai
      UPGRADE_REMOTE_ENABLED: "false"
      MYSQL_HOST_IP: crmeb_demo_mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-crmeb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crmeb}
      REDIS_HOST_IP: crmeb_demo_redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.env.application:/var/www/.env:ro
      - ./.constant:/var/www/.constant:ro
      - ./data/runtime:/var/www/runtime
      - ./data/uploads:/var/www/public/uploads
    healthcheck:
      test: ["CMD", "su", "-s", "/bin/sh", "www-data", "-c", "php -d open_basedir= /usr/local/bin/runtime-healthcheck.php"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [app_net]

  nginx:
    container_name: crmeb_demo_nginx
    image: ${NGINX_IMAGE:?set NGINX_IMAGE}
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "${HTTP_PORT:-8011}:80"
    depends_on:
      phpfpm:
        condition: service_healthy
    volumes:
      - ./data/uploads:/var/www/public/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [app_net]

networks:
  app_net:
    driver: bridge

name: tianli-acceptance

services:
  mysql:
    container_name: crmeb_mysql
    image: ccr.ccs.tencentyun.com/crmebky_php/mysql:v8.0.45
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crmeb}
      MYSQL_USER: ${MYSQL_USER:-crmeb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app_net

  redis:
    container_name: crmeb_redis
    image: ccr.ccs.tencentyun.com/crmebky_php/redis:v8.6.1
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      - --pidfile
      - /data/redis.pid
      - --loglevel
      - notice
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app_net

  phpfpm:
    container_name: crmeb_php
    image: tianli/crmeb-php:acceptance
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      APP_DEBUG: "false"
      MARKETPLACE_QUEUE_AUTOSTART: "${MARKETPLACE_QUEUE_AUTOSTART:-false}"
      DEFAULT_TIMEZONE: Asia/Shanghai
      UPGRADE_REMOTE_ENABLED: "${UPGRADE_REMOTE_ENABLED:-false}"
      MYSQL_HOST_IP: crmeb_mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-crmeb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crmeb}
      REDIS_HOST_IP: crmeb_redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.env.application:/run/application/.env:ro
      - ../../crmeb/.constant:/var/www/.constant:ro
      - runtime_data:/var/www/runtime
      - ../../crmeb/public/uploads:/var/www/public/uploads
      - private-assets:/private
    healthcheck:
      test: ["CMD", "su", "-s", "/bin/sh", "www-data", "-c", "php -d open_basedir= /usr/local/bin/runtime-healthcheck.php"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app_net

  nginx:
    container_name: crmeb_nginx
    image: tianli/crmeb-nginx:acceptance
    build:
      context: ../..
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8011:80"
    depends_on:
      phpfpm:
        condition: service_healthy
    volumes:
      - ../../crmeb/public/uploads:/var/www/public/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app_net

volumes:
  private-assets:
  runtime_data:
    name: tianli_crmeb_runtime
  redis_data:
    name: tianli_crmeb_redis

networks:
  app_net:
    driver: bridge

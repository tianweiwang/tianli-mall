pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        server_name localhost;
        root /srv/h5;
        client_max_body_size 20m;
        add_header X-Preview-Mode "isolated-test-payments" always;
        location = /preview-health { proxy_pass http://preview-app:8000; }
        location ~ ^/(api|adminapi|merchantapi|kefuapi|outapi)(/|$) {
            proxy_pass http://preview-app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /admin { return 302 /admin/; }
        location /admin/ { alias /srv/admin/; try_files $uri $uri/ /admin/index.html; }
        # Existing platform customer-service pages are part of the admin build.
        location = /kefu { rewrite ^ /admin/index.html last; }
        location /kefu/ { rewrite ^ /admin/index.html last; }
        location = /merchant { return 302 /merchant/; }
        location /merchant/ { alias /srv/merchant/; try_files $uri $uri/ /merchant/index.html; }
        location /uploads/ { alias /srv/uploads/; }
        location /statics/ { alias /srv/public/statics/; }
        location = /msg { proxy_pass http://preview-events:40002; proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
        location = /notice { proxy_pass http://preview-events:40001; proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
        location /ws { proxy_pass http://preview-events:40001; proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
        location ~ /\. { return 404; }
        location ~ \.php$ { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}

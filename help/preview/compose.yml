x-php: &php
  image: ${PREVIEW_PHP_IMAGE:?required}
  pull_policy: never
  entrypoint: [php]
  working_dir: /workspace
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [preview]
  environment: &environment
    PREVIEW_ISOLATED: "1"
    PREVIEW_PROJECT: ${PREVIEW_PROJECT:?required}
    PREVIEW_RUN_ID: ${PREVIEW_RUN_ID:?required}
    PREVIEW_LEGACY_REVIEW_FIXTURE: ${PREVIEW_LEGACY_REVIEW_FIXTURE:-0}
    PREVIEW_FULL_RUNTIME: ${PREVIEW_FULL_RUNTIME:-0}
  labels: &labels
    marketplace.preview: ${PREVIEW_PROJECT}

services:
  bootstrap:
    <<: *php
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ${PREVIEW_REPO:?required}:/workspace:ro
      - ${PREVIEW_REPO}:/source:ro
      - vendor:/workspace/crmeb/vendor
      - bootstrap-secrets:/run/preview-bootstrap
      - app-secrets:/run/preview-app
      - redis-secrets:/run/preview-redis
      - runtime:/workspace/crmeb/runtime
      - uploads:/workspace/crmeb/public/uploads
      # The preview's existing bootstrap owns its fresh-directory initialization.
      - type: volume
        source: private-assets
        target: /private
        volume:
          nocopy: true
      - runtime-app:/runtime-app
  preview-mysql:
    image: ${PREVIEW_MYSQL_IMAGE:?required}
    pull_policy: never
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/preview-bootstrap/root-password
      MYSQL_ROOT_HOST: "%"
    command: [--innodb-buffer-pool-size=128M, --max-connections=50, "--sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"]
    volumes:
      - mysql-data:/var/lib/mysql
      - bootstrap-secrets:/run/preview-bootstrap:ro
    networks: [preview]
    labels: *labels
    healthcheck:
      test: [CMD, mysqladmin, ping, --protocol=tcp, --host=127.0.0.1, --silent]
      interval: 2s
      timeout: 2s
      retries: 40
  preview-redis:
    image: ${PREVIEW_REDIS_IMAGE:?required}
    pull_policy: never
    entrypoint: [redis-server]
    command: [/run/preview-redis/redis.conf]
    volumes:
      - redis-secrets:/run/preview-redis:ro
      - redis-data:/data
    networks: [preview]
    labels: *labels
  preview-app:
    <<: *php
    user: "1000:1000"
    stop_signal: SIGINT
    command: [-d, "opcache.validate_timestamps=1", -d, "opcache.revalidate_freq=0", -d, "upload_max_filesize=4M", -d, "post_max_size=8M", -d, "memory_limit=256M", -S, "0.0.0.0:8000", -t, /workspace/crmeb/public, /workspace/help/preview/router.php]
    volumes: &app-volumes
      - ${PREVIEW_REPO}:/workspace:ro
      - vendor:/workspace/crmeb/vendor:ro
      - app-secrets:/run/preview-app:ro
      - runtime:/workspace/crmeb/runtime
      - uploads:/workspace/crmeb/public/uploads
      - private-assets:/private
  preview-events:
    <<: *php
    user: "1000:1000"
    stop_signal: SIGINT
    environment:
      <<: *environment
      PREVIEW_EVENTS_BIND: "1"
    command: [help/preview/console.php, workerman, start]
    volumes: *app-volumes
  preview-timer:
    <<: *php
    user: "1000:1000"
    stop_signal: SIGINT
    command: [help/preview/console.php, timer, start]
    volumes: *app-volumes
  preview-marketplace-queue:
    <<: *php
    user: "1000:1000"
    stop_signal: SIGTERM
    command: [help/preview/console.php, "queue:work", marketplace, "--queue=marketplace", "--sleep=1", "--tries=1"]
    volumes: *app-volumes
  preview-runtime:
    image: ${PREVIEW_PHP_IMAGE:?required}
    pull_policy: never
    user: "0:0"
    entrypoint: [/bin/sh, /usr/local/bin/runtime-entrypoint]
    command: [/usr/bin/supervisord, -c, /etc/supervisor/supervisord.conf]
    working_dir: /var/www
    read_only: true
    tmpfs: [/tmp, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    stop_signal: SIGTERM
    environment:
      APP_ENV: testing
      MARKETPLACE_QUEUE_AUTOSTART: ${PREVIEW_MARKETPLACE_QUEUE_AUTOSTART:-false}
    volumes:
      - runtime-app:/var/www:ro
      - vendor:/var/www/vendor:ro
      - runtime:/var/www/runtime
      - uploads:/var/www/public/uploads
      - private-assets:/private
      - ${PREVIEW_REPO}/docker/php/runtime-entrypoint.sh:/usr/local/bin/runtime-entrypoint:ro
      - ${PREVIEW_REPO}/docker/php/marketplace-startup-check.php:/usr/local/bin/marketplace-startup-check.php:ro
      - ${PREVIEW_REPO}/docker/php/runtime-healthcheck.php:/usr/local/bin/runtime-healthcheck.php:ro
      - ${PREVIEW_REPO}/docker/php/supervisord.conf:/etc/supervisor/supervisord.conf:ro
    healthcheck:
      test: [CMD, php, -d, "open_basedir=", /usr/local/bin/runtime-healthcheck.php]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [preview]
    labels: *labels
  preview-web:
    image: ${PREVIEW_NGINX_IMAGE:?required}
    pull_policy: never
    user: nginx
    entrypoint: [nginx]
    command: [-g, "daemon off;", -c, /etc/nginx/preview.conf]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${PREVIEW_PORT:-18180}:8080"]
    volumes:
      - ${PREVIEW_NGINX_CONFIG:-./nginx.conf}:/etc/nginx/preview.conf:ro
      - ${PREVIEW_ADMIN_DIST:?required}:/srv/admin:ro
      - ${PREVIEW_MERCHANT_DIST:?required}:/srv/merchant:ro
      - ${PREVIEW_H5_DIST:?required}:/srv/h5:ro
      - ${PREVIEW_REPO}/crmeb/public:/srv/public:ro
      - uploads:/srv/uploads:ro
    networks: [preview, ingress]
    labels: *labels
networks:
  preview:
    internal: true
    labels: *labels
  ingress:
    labels: *labels
volumes:
  vendor: {labels: *labels}
  bootstrap-secrets: {labels: *labels}
  app-secrets: {labels: *labels}
  redis-secrets: {labels: *labels}
  mysql-data: {labels: *labels}
  redis-data: {labels: *labels}
  runtime: {labels: *labels}
  uploads: {labels: *labels}
  private-assets: {labels: *labels}
  runtime-app: {labels: *labels}

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr error;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 8080;
        server_name audit-ui;
        root /srv/public/__ms4_assets/h5;
        location ~ ^/api(/|$) {
            proxy_pass http://audit-ms4-customer-h5:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location = /__ms4_fixture__/product.png {
            root /srv/public;
            try_files $uri =404;
        }
        location ~ ^/static/.*\.(js|css|map)$ {
            try_files $uri =404;
        }
        location /static/ {
            try_files $uri @original_static;
        }
        location @original_static {
            root /srv/public;
            try_files $uri =404;
        }
        location ^~ /statics/ {
            root /srv/public;
            try_files $uri =404;
        }
        location ^~ /assets/ {
            try_files $uri =404;
        }
        location ~ ^/pages/.+/static/ {
            try_files $uri =404;
        }
        location = /favicon.ico {
            root /srv/public;
            try_files $uri =404;
        }
        location = /__ms4_assets/h5/index.html {
            internal;
            root /srv/public;
            try_files $uri =404;
        }
        location = / { rewrite ^ /__ms4_assets/h5/index.html last; }
        location = /index.html { rewrite ^ /__ms4_assets/h5/index.html last; }
        location ~ ^/pages/(order_addcart/order_addcart|users/login/index|store/index|goods_details/index|goods/order_confirm/index|goods/order_details/index)$ {
            try_files $uri /__ms4_assets/h5/index.html;
        }
        location / { return 404; }
    }
}

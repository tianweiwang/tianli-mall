# SOURCE candidate only; actual current three-build copy and native validation are separate.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr error;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 8080;
        server_name audit-ui;
        root /srv/public/__ms4_assets/h5;

        # No URI in proxy_pass: the original API path and query are retained.
        location ~ ^/(api|merchantapi|adminapi)(/|$) {
            proxy_pass http://audit-ms4-ui-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location = /merchant { return 302 /merchant/$is_args$args; }
        location = /merchant/ {
            root /srv/public/__ms4_assets;
            try_files /merchant/index.html =404;
        }
        # The merchant router uses hash fragments, not server history paths.
        location ^~ /merchant/ {
            root /srv/public/__ms4_assets;
            try_files $uri =404;
        }

        location = /admin { return 302 /admin/$is_args$args; }
        location = /admin/ {
            root /srv/public/__ms4_assets;
            try_files /admin/index.html =404;
        }
        location = /admin/system_static { return 404; }
        location ^~ /admin/system_static/ {
            root /srv/public/__ms4_assets;
            try_files $uri =404;
        }
        # Resource misses must not receive the admin history entry.
        location ~ ^/admin/.*\.[^/]+$ {
            root /srv/public/__ms4_assets;
            try_files $uri =404;
        }
        location /admin/ {
            root /srv/public/__ms4_assets;
            try_files $uri /admin/index.html$is_args$args;
        }

        # Preserve the original public comment image subtree.
        location ^~ /uploads/store/comment/ {
            root /srv/public;
            try_files $uri =404;
        }
        # Named review PNG only; the customer leaf is a separate read-only volume.
        location ~ "^/uploads/customer/[1-9][0-9]{0,9}/[a-f0-9]{32}/[a-f0-9]{32}[.]png$" {
            root /srv/public;
            try_files $uri =404;
        }
        location = /__ms4_fixture__/product.png {
            root /srv/public;
            try_files $uri =404;
        }
        location ~ ^/static/.*\.(js|css|map)$ {
            try_files $uri =404;
        }
        location /static/ {
            try_files $uri @original_static;
        }
        location @original_static {
            root /srv/public;
            try_files $uri =404;
        }
        location ^~ /statics/ {
            root /srv/public;
            try_files $uri =404;
        }
        location ^~ /assets/ {
            try_files $uri =404;
        }
        location ~ ^/pages/.+/static/ {
            try_files $uri =404;
        }
        location ~ ^/pages/.*\.(js|css|map)$ {
            try_files $uri =404;
        }
        location = /favicon.ico {
            root /srv/public;
            try_files $uri =404;
        }
        location = /__ms4_assets/h5/index.html {
            internal;
            root /srv/public;
            try_files $uri =404;
        }
        location = / { rewrite ^ /__ms4_assets/h5/index.html last; }
        location = /index.html { rewrite ^ /__ms4_assets/h5/index.html last; }
        location ~ ^/pages/(order_addcart/order_addcart|users/login/index|store/index|goods_details/index|goods/order_confirm/index|goods/order_details/index|goods/order_list/index|goods/marketplace_aftersale/index|goods/marketplace_review/index|goods/goods_comment_list/index)$ {
            try_files $uri /__ms4_assets/h5/index.html$is_args$args;
        }
        location / { return 404; }
    }
}

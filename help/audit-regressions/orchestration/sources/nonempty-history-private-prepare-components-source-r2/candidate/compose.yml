x-php: &php
  image: sha256:1099f749e2a38ec9453c6b820db8a78174514bc72d14edf5c203e13b82816e0a
  pull_policy: never
  entrypoint: [php]
  working_dir: /workspace
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [isolation]
  environment: &audit-env
    AUDIT_ISOLATED: "1"
    AUDIT_RUN_ID: ${AUDIT_RUN_ID:?required}
    AUDIT_RUN_DIR: /run/audit
    AUDIT_REPO_DIR: /workspace
    AUDIT_PROJECT: ${AUDIT_PROJECT:?required}
    AUDIT_SOURCE_SHA: ${AUDIT_SOURCE_SHA:?required}
    AUDIT_GUARD_MODE: read-only
    MS4_PROOF_NAME: ${MS4_PROOF_NAME:-initializer}
  labels: &labels
    tianli.audit: "1"
    tianli.audit.run: ${AUDIT_RUN_ID}

services:
  audit-bootstrap:
    <<: *php
    command: [/run/ms4-prep/ms4-initialize.php, "${MS4_BOOTSTRAP_PHASE:-prepare}"]
    volumes:
      - ${AUDIT_REPO_DIR:?required}:/workspace:ro
      - ${AUDIT_REPO_DIR:?required}:/source:ro
      - ${MS4_PREP_DIR:?required}:/run/ms4-prep:ro
      - ${AUDIT_RUN_DIR:?required}:/run/audit
      - bootstrap-secrets:/run/audit-bootstrap:${MS4_BOOTSTRAP_PRIVATE_MODE:-ro}
      - redis-secrets:/run/audit-redis:${MS4_BOOTSTRAP_PRIVATE_MODE:-ro}
      - app-secrets:/run/audit-app:${MS4_BOOTSTRAP_PRIVATE_MODE:-ro}
      - fixture-secrets:/run/audit-fixtures:${MS4_BOOTSTRAP_PRIVATE_MODE:-ro}
  audit-ms4-initialize:
    <<: *php
    command: [/run/ms4-prep/ms4-initialize.php]
    volumes:
      - ${AUDIT_REPO_DIR:?required}:/workspace:ro
      - ${AUDIT_REPO_DIR:?required}:/source:ro
      - ${MS4_PREP_DIR:?required}:/run/ms4-prep:ro
      - ${AUDIT_RUN_DIR:?required}:/run/audit
      - bootstrap-secrets:/run/audit-bootstrap:ro
      - app-secrets:/run/audit-app:ro
  audit-ms4-migration:
    <<: *php
    command: [help/audit-regressions/isolated/ms4-migration.php]
    environment:
      <<: *audit-env
      AUDIT_MILESTONE: MS4
      AUDIT_PHASE: normal-only
    volumes:
      - ${AUDIT_REPO_DIR:?required}:/workspace:ro
      - ${AUDIT_REPO_DIR:?required}:/source:ro
      - ${AUDIT_RUN_DIR:?required}:/run/audit
      - bootstrap-secrets:/run/audit-bootstrap:ro
      - app-secrets:/run/audit-app:ro
  audit-legacy-files-bootstrap:
    <<: *php
    working_dir: /legacy-workspace/crmeb
    tmpfs: [/tmp, /legacy-runtime]
    command: [/run/nonempty/legacy-files-bootstrap.php, "--freeze-bytes=${NONEMPTY_FREEZE_BYTES:?required}", "--freeze-sha256=${NONEMPTY_FREEZE_SHA256:?required}"]
    volumes:
      - ${AUDIT_REPO_DIR:?required}:/workspace:ro
      - ${AUDIT_REPO_DIR:?required}:/source:ro
      - ${LEGACY_REPO_DIR:?required}:/legacy-source:ro
      - ${LEGACY_REPO_DIR:?required}:/legacy-workspace:ro
      - ${MS4_PREP_DIR:?required}:/run/nonempty:ro
      - ${AUDIT_RUN_DIR:?required}:/run/audit
      - bootstrap-secrets:/run/audit-bootstrap:ro
      - app-secrets:/run/audit-app:ro
  audit-legacy-history-producer:
    <<: *php
    working_dir: /legacy-workspace/crmeb
    tmpfs: [/tmp, "/legacy-runtime:mode=0700"]
    command: [/run/nonempty/legacy-history-producer.php, normal, "--freeze-bytes=${NONEMPTY_FREEZE_BYTES:?required}", "--freeze-sha256=${NONEMPTY_FREEZE_SHA256:?required}"]
    volumes:
      - ${AUDIT_REPO_DIR:?required}:/workspace:ro
      - ${AUDIT_REPO_DIR:?required}:/source:ro
      - ${LEGACY_REPO_DIR:?required}:/legacy-source:ro
      - ${LEGACY_REPO_DIR:?required}:/legacy-workspace:ro
      - ${MS4_PREP_DIR:?required}:/run/nonempty:ro
      - ${AUDIT_RUN_DIR:?required}:/run/audit
      - app-secrets:/run/audit-app:ro
      - fixture-secrets:/run/audit-fixtures:ro
  audit-mysql:
    image: sha256:c7a313f1402365dc91253bdbdb1e74c6a361b036106d8bd25b8ec8e2dd0069f4
    pull_policy: never
    command: [mysqld, "--sql-mode=STRICT_TRANS_TABLES,ONLY_FULL_GROUP_BY,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION", "--information_schema_stats_expiry=0"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/audit-bootstrap/root-password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
      - bootstrap-secrets:/run/audit-bootstrap:ro
    networks: [isolation]
    labels: *labels
    healthcheck:
      test: [CMD, mysqladmin, ping, --protocol=tcp, --host=127.0.0.1, --silent]
      interval: 2s
      timeout: 2s
      retries: 40
  audit-redis:
    image: sha256:6c8f6edc1aa871a76a257ef86a2089d108e64b78d16f45b89f09c6a4ab30d07e
    pull_policy: never
    entrypoint: [redis-server]
    command: [/run/audit-redis/redis.conf]
    volumes:
      - redis-secrets:/run/audit-redis:ro
      - redis-data:/data
    networks: [isolation]
    labels: *labels

networks:
  isolation:
    internal: true
    labels: *labels
volumes:
  mysql-data:
    labels: *labels
  redis-data:
    labels: *labels
  bootstrap-secrets:
    labels: *labels
  redis-secrets:
    labels: *labels
  app-secrets:
    labels: *labels
  fixture-secrets:
    labels: *labels

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr error;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        server_name audit-ui;
        root /srv;
        location = /admin { return 302 /admin/; }
        location ^~ /admin/ { try_files $uri $uri/ /admin/index.html; }
        location = /kefu { try_files /admin/index.html =404; }
        location ^~ /kefu/ { try_files $uri /admin/index.html; }
        location = /msg {
            proxy_pass http://audit-chat:40002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 120s;
        }
        location / {
            proxy_pass http://audit-app:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }
    }
}

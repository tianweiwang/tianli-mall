# Narrow overlay for compose.yml. No new network, published port, app secret or database privilege.
services:
  audit-bootstrap:
    environment:
      AUDIT_LICENCE_NORMAL: "1"
      AUDIT_GUARD_MODE: read-only
    volumes:
      - customer-licence-private:/run/audit-customer-licence
  audit-app:
    environment:
      AUDIT_LICENCE_NORMAL: "1"
      AUDIT_GUARD_MODE: read-only
    volumes:
      - customer-licence-private:/run/audit-customer-licence
  audit-runner:
    environment:
      AUDIT_LICENCE_NORMAL: "1"
      AUDIT_GUARD_MODE: read-only
    volumes:
      - customer-licence-private:/run/audit-customer-licence:ro

volumes:
  customer-licence-private:
    labels:
      tianli.audit: "1"
      tianli.audit.run: ${AUDIT_RUN_ID:?required}

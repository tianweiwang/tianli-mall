map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    client_max_body_size 100M;

    location ^~ /install {
        return 404;
    }

    location = /merchant {
        return 308 /merchant/;
    }

    location = /merchant/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /merchant/static/ {
        try_files $uri =404;
        expires 12h;
        access_log off;
    }

    location ^~ /merchant/ {
        try_files $uri $uri/ /merchant/index.html;
    }

    location ^~ /pages/ {
        try_files $uri $uri/ /index.html;
    }

    location /notice {
        proxy_pass http://phpfpm:40001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /msg {
        proxy_pass http://phpfpm:40002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(?:gif|jpe?g|png|bmp|webp|svg|ico)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 12h;
        access_log off;
    }
}
